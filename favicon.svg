<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#eab308" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Luxury Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" ry="104" fill="none" stroke="url(#goldBorder)" stroke-width="4" opacity="0.7"/>

  <!-- Sparkling Diamond -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <polygon points="0,-34 30,-8 0,24 -30,-8" fill="url(#goldGrad)"/>
    <polygon points="0,-34 12,-8 0,24" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-34 -12,-8 0,24" fill="#ca8a04" opacity="0.8"/>
  </g>

  <!-- Crown Arch -->
  <path d="M190 165 Q256 195 322 165 Q295 200 256 205 Q217 200 190 165 Z" fill="url(#goldGrad)"/>
  <circle cx="190" cy="165" r="5" fill="#fef08a"/>
  <circle cx="322" cy="165" r="5" fill="#fef08a"/>

  <!-- Sleek Crescent Arch -->
  <path d="M110 260 Q256 180 402 260 Q256 198 110 260 Z" fill="url(#silverGrad)" opacity="0.85"/>

  <!-- UL Monogram Text -->
  <text x="256" y="345" font-family="'Times New Roman', 'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="110" font-weight="900" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">UL</text>

  <!-- JEWELLERY Subtext with divider lines -->
  <line x1="70" y1="390" x2="160" y2="390" stroke="url(#goldBorder)" stroke-width="2"/>
  <text x="256" y="398" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="20" font-weight="800" letter-spacing="12" fill="#fef08a" text-anchor="middle">JEWELLERY</text>
  <line x1="352" y1="390" x2="442" y2="390" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Bottom Star Accent -->
  <polygon points="256,425 260,436 271,439 260,442 256,453 252,442 241,439 252,436" fill="#fef08a" filter="url(#glow)"/>
</svg>